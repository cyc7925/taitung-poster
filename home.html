<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記泳裝店 - 旅遊導覽首頁</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-blue: #4ECDC4;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; -webkit-text-size-adjust: 100%;
            min-height: 100vh;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 10px 20px 40px 20px; }

        /* === 1. 漂浮 Emoji 區塊 === */
        .emoji-cluster {
            text-align: center;
            margin-top: 20px; /* 稍微縮小頂部距離 */
            margin-bottom: 5px; /* 稍微縮小底部距離 */
            user-select: none;
        }
        .emo-group { display: inline-block; position: relative; }
        
        .e-ring { display: inline-block; font-size: 32px; transform: rotate(-15deg) translate(-5px, -5px); animation: float1 3s ease-in-out infinite; }
        .e-bikini { display: inline-block; font-size: 42px; position: relative; z-index: 2; animation: float2 3s ease-in-out infinite 0.5s; }
        .e-goggles { display: inline-block; font-size: 30px; transform: rotate(15deg) translate(5px, -10px); position: relative; animation: float3 3s ease-in-out infinite 1s; }
        .e-sparkle { position: absolute; top: -10px; right: -15px; font-size: 20px; transform: rotate(10deg); color: #FFD700; text-shadow: 0 0 5px rgba(255,215,0,0.8); }
        .e-onepiece { display: block; font-size: 30px; transform: rotate(15deg) translate(25px, -15px); margin-top: -15px; animation: float4 3s ease-in-out infinite 1.5s; }

        @keyframes float1 { 0%, 100% { transform: rotate(-15deg) translate(-5px, -5px); } 50% { transform: rotate(-15deg) translate(-5px, -10px); } }
        @keyframes float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes float3 { 0%, 100% { transform: rotate(15deg) translate(5px, -10px); } 50% { transform: rotate(15deg) translate(5px, -15px); } }
        @keyframes float4 { 0%, 100% { transform: rotate(15deg) translate(25px, -15px); } 50% { transform: rotate(15deg) translate(25px, -20px); } }

        /* === 2. 店名標題 === */
        .store-name { 
            text-align: center; font-size: 38px; font-weight: bold; 
            color: var(--pop-pink); letter-spacing: 2px; 
            margin-top: 5px; margin-bottom: 20px; /* 收緊標題上下距離 */
        }

        /* === 3. 聯絡與導航資訊列 === */
        .info-card { margin-bottom: 30px; padding: 0 10px; }
        .info-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 0; /* 縮減 padding，讓行高變小 */
            border-bottom: 2px dashed #b0bec5; 
        }
        
        .info-left { font-size: 16px; font-weight: bold; color: var(--ink-dark); display: flex; align-items: center; gap: 12px; }
        .info-icon { font-size: 22px; display: inline-block; width: 28px; text-align: center; color: #555; }
        .phone-text { color: #0000EE; text-decoration: underline; font-weight: bold; font-family: sans-serif; letter-spacing: 0.5px; font-size: 17px; }

        .info-btn { 
            padding: 6px 18px; /* 稍微縮小按鈕 */
            border: 2.5px solid var(--ink-dark); border-radius: 25px; 
            font-size: 14px; font-weight: bold; color: var(--ink-dark); text-decoration: none;
            box-shadow: 2px 2px 0px var(--ink-dark); transition: 0.2s; display: inline-block; text-align: center;
        }
        .info-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink-dark); }
        .btn-white { background: white; }
        .btn-yellow { background: var(--pop-yellow); }


        /* === 4. 泡湯 SPA 推薦區塊 === */
        .section-title { font-size: 17px; font-weight: bold; color: var(--ink-dark); margin: 25px 0 12px 0; border-bottom: 2px dashed #CCC; padding-bottom: 6px; display: flex; align-items: center; gap: 6px; }

        .spa-card { background: white; border: 2.5px solid var(--ink-dark); border-radius: 12px; padding: 10px; margin-bottom: 10px; box-shadow: 3px 3px 0px rgba(44,62,80,0.1); } /* 縮減 padding 和 margin */
        .spa-top { display: flex; justify-content: space-between; align-items: center; }
        .spa-title-area { flex: 1; padding-right: 10px; }
        .spa-name { font-size: 16px; font-weight: bold; color: var(--ink-dark); line-height: 1.1; margin-bottom: 4px; } /* 縮緊行高 */
        .spa-short { font-size: 12px; color: #666; margin-top: 0; line-height: 1.3; } /* 縮緊行高 */
        
        .spa-nav-btn { background: var(--pop-yellow); color: var(--ink-dark); text-decoration: none; padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: bold; border: 2px solid var(--ink-dark); white-space: nowrap; box-shadow: 2px 2px 0px var(--ink-dark); transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .spa-nav-btn:active { transform: translate(2px,2px); box-shadow: none; }
        
        details { margin-top: 8px; border-top: 1px dashed #CCC; padding-top: 8px; } /* 縮減間距 */
        summary { font-size: 13px; font-weight: bold; color: var(--pop-pink); cursor: pointer; outline: none; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .info-list { list-style: none; padding: 0; margin: 0; font-size: 12px; line-height: 1.4; color: #444; } /* 縮緊行高 */
        .info-list li { margin-bottom: 4px; display: flex; }
        .info-label { font-weight: bold; color: var(--ink-dark); width: 45px; flex-shrink: 0; }

        /* === 5. 附近景點四宮格 === */
        .spot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .spot-card { background: white; border: 2.5px solid var(--pop-blue); border-radius: 12px; padding: 12px 10px; text-align: center; text-decoration: none; display: block; transition: 0.2s; box-shadow: 3px 3px 0px rgba(78, 205, 196, 0.2); }
        .spot-card:active { transform: scale(0.96); background: #f0fbf9; box-shadow: none; }
        .spot-icon { font-size: 24px; margin-bottom: 4px; }
        .spot-name { font-size: 14px; font-weight: bold; color: var(--ink-dark); margin-bottom: 4px; }
        .spot-desc { font-size: 11px; color: #666; }

        /* === 6. 近期活動區塊 === */
        .events-header { text-align: center; margin-bottom: 15px; }
        .events-header h2 { font-size: 22px; font-weight: bold; color: var(--ink-dark); margin: 0 0 8px 0; letter-spacing: 1px; }
        .events-header p { font-size: 14px; font-weight: bold; color: #555; margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; }

        .event-btn { 
            display: block; width: 100%; box-sizing: border-box; text-align: center;
            padding: 16px; border-radius: 16px; font-size: 18px; font-weight: bold;
            border: 2.5px solid var(--ink-dark); margin-bottom: 15px; text-decoration: none;
        }
        .yellow-btn { background: var(--pop-yellow); color: var(--ink-dark); box-shadow: 3px 3px 0px var(--ink-dark); transition: 0.2s; }
        .yellow-btn:active { transform: translate(3px,3px); box-shadow: 0px 0px 0px transparent; }
        .gray-btn { background: rgba(255,255,255,0.7); color: #888; border-color: #CCC; box-shadow: none; }

        /* 底部標語 */
        .footer-text { text-align: center; font-size: 13px; font-weight: bold; color: var(--ink-dark); margin-top: 30px; }
    </style>
</head>
