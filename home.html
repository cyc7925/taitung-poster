<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記泳裝店 - 近期活動</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --bg-yellow: #FFF9E6;    
            --ink-dark: #2C3E50;     
            --pop-blue: #4ECDC4;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background-color: var(--bg-yellow); 
            background-image: linear-gradient(180deg, #E0F7FA 0%, var(--bg-yellow) 100%);
            background-repeat: no-repeat; background-attachment: fixed;
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; -webkit-text-size-adjust: 100%;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .container { 
            max-width: 400px; width: 100%; box-sizing: border-box; 
            padding: 20px;
            display: flex; flex-direction: column; gap: 30px; 
        }

        /* === 1. 店家主體資訊 === */
        .shop-section { text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .shop-name { 
            font-size: 42px; font-weight: bold; color: var(--pop-pink); 
            margin: 0 0 18px 0; letter-spacing: 2px; line-height: 1.1;
        }
        
        .shop-info-box {
            display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px;
        }
        .info-line {
            font-size: 16px; font-weight: bold; color: var(--ink-dark); margin: 0; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .action-row { display: flex; gap: 15px; justify-content: center; width: 100%; }
        
        .btn-action {
            flex: 1; padding: 15px 0; border-radius: 18px; border: 3px solid var(--ink-dark);
            font-size: 16px; font-weight: bold; color: var(--ink-dark); text-decoration: none;
            box-shadow: 4px 4px 0px var(--ink-dark); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-call { background: var(--pop-yellow); }
        .btn-map { background: white; }
        .btn-action:active { transform: translate(3px,3px); box-shadow: 0px 0px 0px var(--ink-dark); }

        /* === 2. 近期活動區塊 === */
        .event-section { text-align: center; display: flex; flex-direction: column; align-items: center;}
        
        .hero-title { 
            margin: 15px 0 5px 0; font-size: 26px; letter-spacing: 2px; color: var(--ink-dark); font-weight: bold;
        }
        
        /* 副標題與向量溫泉 Icon */
        .hero-subtitle { 
            margin: 0 0 25px 0; font-size: 15px; color: #666; font-weight: bold; 
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        .year-btn {
            display: block; width: 100%; box-sizing: border-box;
            padding: 20px; font-size: 20px; font-weight: bold;
            border-radius: 20px; text-decoration: none; transition: 0.2s;
            border: 3px solid var(--ink-dark); margin-bottom: 15px;
        }
        .btn-2026 { background: var(--pop-yellow); color: var(--ink-dark); box-shadow: 4px 4px 0px var(--ink-dark); }
        .btn-2026:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--ink-dark); }
        .btn-2027 { background: white; color: #999; border-color: #CCC; box-shadow: 4px 4px 0px #EEE; pointer-events: none; margin-bottom: 0;}

        /* === 3. 頁尾暖心標語 === */
        .slogan-footer {
            margin-top: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .slogan-text {
            font-size: 15px; font-weight: bold; color: var(--ink-dark); letter-spacing: 1.5px;
            display: flex; align-items: center; gap: 4px;
        }

        /* --- SVG 動畫區 --- */
        @keyframes pulse-sun { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes float-steam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes wave-move { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
        
        .anim-sun { animation: pulse-sun 3s ease-in-out infinite; transform-origin: 70px 35px; }
        .anim-steam-1 { animation: float-steam 2.5s ease-in-out infinite; }
        .anim-steam-2 { animation: float-steam 2.5s ease-in-out infinite 1.2s; }
        .anim-wave-1 { animation: wave-move 3s ease-in-out infinite; }
        .anim-wave-2 { animation: wave-move 3s ease-in-out infinite 1.5s; }

    </style>
</head>
