<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台東活動總整理 - 東泳記泳裝店</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --bg-yellow: #FFF9E6;    
            --ink-dark: #2C3E50;     
            --pop-blue: #4ECDC4;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background-color: var(--bg-yellow); color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; -webkit-text-size-adjust: 100%;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .container { max-width: 400px; margin: 0 auto; padding: 0 20px; width: 100%; box-sizing: border-box; }

        /* === 頂部設計 === */
        .top-section {
            background: linear-gradient(180deg, #E0F7FA 0%, var(--bg-yellow) 100%);
            padding: 30px 0;
            border-bottom: 3px dashed var(--pop-blue);
            text-align: center;
        }

        /* 標題與動畫設定 */
        .header { text-align: center; margin-bottom: 10px; }
        .title-box {
            background: white; border: 3px solid var(--ink-dark); border-radius: 20px; padding: 15px 20px; 
            box-shadow: 5px 5px 0px var(--pop-pink); display: inline-block; position: relative; z-index: 2; margin-top: -10px;
        }
        .title-box h1 { margin: 0; font-size: 24px; letter-spacing: 1px; color: var(--ink-dark); }
        .title-box p { margin: 5px 0 0 0; font-size: 15px; color: #666; font-weight: bold; }

        /* --- SVG 動畫區 --- */
        @keyframes pulse-sun { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes float-steam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes wave-move { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
        
        .anim-sun { animation: pulse-sun 3s ease-in-out infinite; transform-origin: 70px 35px; }
        .anim-steam-1 { animation: float-steam 2.5s ease-in-out infinite; }
        .anim-steam-2 { animation: float-steam 2.5s ease-in-out infinite 1.2s; }
        .anim-wave-1 { animation: wave-move 3s ease-in-out infinite; }
        .anim-wave-2 { animation: wave-move 3s ease-in-out infinite 1.5s; }

        /* === 按鈕導覽區 === */
        .nav-section { padding: 40px 0; text-align: center; }
        
        .nav-hint { font-size: 18px; font-weight: bold; margin-bottom: 25px; color: var(--ink-dark); }
        
        .year-btn {
            display: block; width: 100%; box-sizing: border-box;
            padding: 18px; margin-bottom: 20px; font-size: 18px; font-weight: bold;
            border-radius: 18px; text-decoration: none; transition: 0.2s;
            border: 3px solid var(--ink-dark);
        }
        
        .btn-2026 { 
            background: var(--pop-yellow); color: var(--ink-dark); 
            box-shadow: 5px 5px 0px var(--ink-dark); 
        }
        .btn-2026:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px var(--ink-dark); }

        .btn-2027 { 
            background: white; color: #999; border-color: #CCC;
            box-shadow: 5px 5px 0px #EEE; pointer-events: none;
        }

        /* 店家資訊 */
        .footer-info { margin-top: 20px; text-align: center; padding-bottom: 30px; }
        .store-name { font-size: 18px; font-weight: bold; color: var(--pop-pink); margin-bottom: 10px; }
        .store-loc { color: var(--ink-dark); text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-section">
    <div class="container">
        <div class="header">
            <svg width="140" height="90" viewBox="0 0 140 90" xmlns="http://www.w3.org/2000/svg">
                <circle cx="70" cy="35" r="18" fill="#FFE66D" stroke="#2C3E50" stroke-width="3" class="anim-sun"/>
                <path d="M 10 70 L 40 30 L 70 70 Z" fill="#A8E6CF" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round"/>
                <path d="M 50 70 L 90 20 L 130 70 Z" fill="#4ECDC4" stroke="#2C3E50" stroke-width="3" stroke-linejoin="round"/>
                <path d="M 60 50 Q 55 40 60 30" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" class="anim-steam-1"/>
                <path d="M 75 45 Q 70 35 75 25" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" class="anim-steam-2"/>
                <path d="M 10 75 Q 35 65 70 75 T 130 75" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" class="anim-wave-1"/>
                <path d="M 10 85 Q 35 75 70 85 T 130 85" fill="none" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round" class="anim-wave-2"/>
            </svg>
            <div class="title-box">
                <h1>台東活動總整理</h1>
                <p>♨️泡暖湯・穿泳裝・玩台東</p>
            </div>
        </div>
    </div>
</div>

<div class="nav-section">
    <div class="container">
        <div class="nav-hint">👇 請選擇活動年份 👇</div>
        
        <!-- 連接到你剛剛做好的 2026 網頁 -->
        <a href="2026.html" class="year-btn btn-2026">📅 2026 全年活動 (點我觀看)</a>
        
        <!-- 2027 目前設定為灰色不可點擊，等你明年做好了再來打開 -->
        <a href="#" class="year-btn btn-2027">✨ 2027 最新活動 (敬請期待)</a>
        
        <div class="footer-info">
            <div class="store-name">東泳記泳裝店</div>
            <a href="https://maps.app.goo.gl/qaywzMaHnHRe98AF8?g_st=ic" target="_blank" class="store-loc">📍 台東縣卑南鄉溫泉路370號</a>
        </div>
    </div>
</div>

</body>
</html>
