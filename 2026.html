<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026近期活動整理 - 東泳記泳裝店</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --bg-yellow: #FFF9E6;    
            --ink-dark: #2C3E50;     
            --pop-blue: #4ECDC4;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
            --pop-green: #A8E6CF;    
            --pop-purple: #CBAACB;   
        }

        body {
            background-color: var(--bg-yellow); color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; -webkit-text-size-adjust: 100%;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 0 15px; }

        /* === 店家導覽列 (永遠置頂) === */
        .sticky-navbar {
            position: sticky; top: 0; z-index: 100;
            height: 80px; box-sizing: border-box; 
            background: white; border-bottom: 3px solid var(--ink-dark);
            padding: 0 15px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 0px rgba(0,0,0,0.05);
        }
        .nav-info { display: flex; flex-direction: column; gap: 4px; }
        
        /* 店名字體放大，與地址齊寬 */
        .nav-store { font-size: 28px; font-weight: bold; color: var(--pop-pink); letter-spacing: 1px; line-height: 1.1; }
        .nav-loc { color: var(--ink-dark); text-decoration: none; font-size: 13px; font-weight: bold; border-bottom: 1px solid var(--ink-dark); display: inline-block; padding-bottom: 1px;}
        
        .btn-call {
            background: var(--pop-yellow); border: 3px solid var(--ink-dark); border-radius: 12px; padding: 8px 12px; 
            font-size: 13px; font-weight: bold; color: var(--ink-dark); text-decoration: none; transition: 0.2s;
            white-space: nowrap; flex-shrink: 0; box-shadow: 2px 2px 0px var(--ink-dark);
        }
        .btn-call:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px var(--ink-dark); }

        /* === 標題與插畫 (無框自然版) === */
        .hero-section { text-align: center; padding: 25px 15px 15px 15px; }
        .hero-title { font-size: 24px; font-weight: bold; color: var(--ink-dark); margin: 15px 0 5px 0; letter-spacing: 1px; }
        .hero-subtitle { font-size: 14px; color: #666; font-weight: bold; margin: 0; }

        /* --- SVG 動畫區 --- */
        @keyframes pulse-sun { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes float-steam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes wave-move { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
        
        .anim-sun { animation: pulse-sun 3s ease-in-out infinite; transform-origin: 70px 35px; }
        .anim-steam-1 { animation: float-steam 2.5s ease-in-out infinite; }
        .anim-steam-2 { animation: float-steam 2.5s ease-in-out infinite 1.2s; }
        .anim-wave-1 { animation: wave-move 3s ease-in-out infinite; }
        .anim-wave-2 { animation: wave-move 3s ease-in-out infinite 1.5s; }

        /* === 雙層月份子標題接力置頂 === */
        .month-header { 
            position: sticky; top: 80px; z-index: 90; 
            background: var(--bg-yellow); 
            padding: 12px 15px; margin: 0 -15px; 
            display: flex; flex-direction: column; gap: 4px;
        }
        .month-context {
            font-size: 13px; color: var(--pop-pink); font-weight: bold; letter-spacing: 0.5px;
        }
        .month-title {
            font-size: 19px; font-weight: bold; color: var(--ink-dark);
            display: flex; align-items: center; gap: 10px; width: 100%;
        }
        .month-title::after { content: ""; flex: 1; height: 4px; background: var(--pop-pink); border-radius: 2px; opacity: 0.5;}
        
        /* 內容區塊 */
        .content-section { padding-bottom: 40px; }
        .timeline { border-left: 4px dotted var(--pop-blue); margin-left: 20px; padding-left: 25px; padding-bottom: 15px; padding-top: 5px;}
        .event { position: relative; margin-bottom: 25px; }
        .event::before {
            content: ''; position: absolute; left: -35px; top: 15px; width: 14px; height: 14px;
            background: var(--pop-yellow); border: 4px solid var(--ink-dark); border-radius: 50%;
        }
        
        .event-card { background: white; border: 3px solid var(--ink-dark); border-radius: 16px; padding: 15px; box-shadow: 4px 4px 0px rgba(44, 62, 80, 0.15); }
        .event-date { font-weight: bold; font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: 12px; padding: 3px 8px; border-radius: 8px; font-weight: bold; letter-spacing: 0.5px; border: 2px solid var(--ink-dark); }
        
        .tag-music { background: var(--pop-yellow); color: var(--ink-dark); } 
        .tag-market { background: var(--pop-pink); color: white; }   
        .tag-sport { background: var(--pop-blue); color: white; }   
        .tag-free { background: white; color: var(--pop-pink); }     
        .tag-fee { background: var(--pop-purple); color: white; }     
        .tag-art { background: var(--pop-green); color: var(--ink-dark); }

        .event-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .event-desc { font-size: 14px; color: #555; margin-bottom: 8px; line-height: 1.4; }
        .event-loc { font-size: 13px; font-weight: bold; color: var(--ink-dark); background: #f0f4f8; padding: 5px 10px; border-radius: 8px; display: inline-block; }
        
        .cancelled { background: #f8f9fa; border-style: dashed; box-shadow: none; opacity: 0.8; }
        .cancelled .event-title { color: #888; text-decoration: line-through; }
        .cancelled .event-desc { color: var(--pop-pink); font-weight: bold; }

        .home-btn {
            display: inline-block; background: white; border: 3px solid var(--ink-dark); border-radius: 15px;
            padding: 10px 20px; font-size: 16px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 3px 3px 0px var(--ink-dark); transition: 0.2s;
        }
        .home-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--ink-dark); }
    </style>
</head>
<body>

<div class="sticky-navbar">

        <div class="nav-store">東泳記泳裝店</div>

    </div>
    <a href="tel:0910557998" class="btn-call">撥打電話</a>
</div>
