<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026臺東縣近期活動資訊 - 東泳記泳裝店</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --bg-yellow: #FFF9E6;    
            --ink-dark: #2C3E50;     
            --pop-blue: #4ECDC4;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
            --pop-green: #A8E6CF;    
            --pop-purple: #CBAACB;   
        }

        body {
            background-color: var(--bg-yellow); color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; -webkit-text-size-adjust: 100%;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 0 15px; }

        /* === 店家導覽列 === */
        .sticky-navbar {
            position: sticky; top: 0; z-index: 100;
            height: max(80px, calc(60px + env(safe-area-inset-top))); box-sizing: border-box; 
            background: white; border-bottom: 3px solid var(--ink-dark);
            padding: max(10px, env(safe-area-inset-top)) 15px 10px 15px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 0px rgba(0,0,0,0.05);
        }
        .nav-info { display: flex; flex-direction: column; gap: 4px; }
        
        .nav-store { font-size: 24px; font-weight: bold; color: var(--pop-pink); letter-spacing: 1px; line-height: 1.1; }
        .nav-loc { color: var(--ink-dark); text-decoration: none; font-size: 13px; font-weight: bold; display: inline-block; padding-bottom: 1px;}
        
        .btn-call {
            background: var(--pop-yellow); border: 3px solid var(--ink-dark); border-radius: 12px; padding: 8px 10px; 
            font-size: 13px; font-weight: bold; color: var(--ink-dark); text-decoration: none; transition: 0.2s;
            white-space: nowrap; flex-shrink: 0; box-shadow: 2px 2px 0px var(--ink-dark);
        }
        .btn-call:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px var(--ink-dark); }

        /* === 標題與插畫 === */
        .hero-section { 
            display: flex; align-items: center; justify-content: center; gap: 15px; 
            padding: 25px 10px 15px 10px; 
        }
        .hero-text { 
            display: flex; flex-direction: column; align-items: flex-start;
        }
        .hero-title { 
            font-weight: bold; color: var(--ink-dark); 
            margin: 0 0 4px 0; line-height: 1.1; 
            white-space: nowrap;
        }
        .title-year { font-size: 32px; color: var(--pop-pink); letter-spacing: 1px; display: block; }
        .title-text { font-size: 17px; display: block; margin-top: 2px;}
        .hero-subtitle { font-size: 13px; color: #666; font-weight: bold; margin: 0; }

        /* --- SVG 動畫區 --- */
        @keyframes pulse-sun { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes float-steam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes wave-move { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-4px); } }
        
        .anim-sun { animation: pulse-sun 3s ease-in-out infinite; transform-origin: 70px 35px; }
        .anim-steam-1 { animation: float-steam 2.5s ease-in-out infinite; }
        .anim-steam-2 { animation: float-steam 2.5s ease-in-out infinite 1.2s; }
        .anim-wave-1 { animation: wave-move 3s ease-in-out infinite; }
        .anim-wave-2 { animation: wave-move 3s ease-in-out infinite 1.5s; }

        /* === 雙層月份子標題 === */
        .month-header { 
            position: sticky; top: max(80px, calc(60px + env(safe-area-inset-top))); z-index: 90; 
            background: var(--bg-yellow); 
            padding: 12px 15px; margin: 0 -15px; 
            display: flex; flex-direction: column; gap: 4px;
        }
        .month-context { font-size: 13px; color: var(--pop-pink); font-weight: bold; letter-spacing: 0.5px; }
        .month-title { font-size: 19px; font-weight: bold; color: var(--ink-dark); display: flex; align-items: center; gap: 10px; width: 100%; }
        .month-title::after { content: ""; flex: 1; height: 4px; background: var(--pop-pink); border-radius: 2px; opacity: 0.5;}
        
        /* 內容區塊 */
        .content-section { padding-bottom: 80px; }
        
        .timeline { border-left: 4px dotted var(--pop-blue); margin-left: 20px; padding-left: 25px; padding-bottom: 15px; padding-top: 5px;}
        .event { position: relative; margin-bottom: 25px; }
        .event::before {
            content: ''; position: absolute; left: -35px; top: 15px; width: 14px; height: 14px;
            background: var(--pop-yellow); border: 4px solid var(--ink-dark); border-radius: 50%;
        }
        
        .event-card { background: white; border: 3px solid var(--ink-dark); border-radius: 16px; padding: 15px; box-shadow: 4px 4px 0px rgba(44, 62, 80, 0.15); transition: 0.4s ease-out; }
        
        /* 日期與時間合併排版 */
        .event-date { font-weight: bold; font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
        .e-time { font-size: 14px; color: #555; } /* 時間稍微調小一點，增加層次 */
        
        .tag { font-size: 12px; padding: 3px 8px; border-radius: 8px; font-weight: bold; letter-spacing: 0.5px; border: 2px solid var(--ink-dark); }
        
        .tag-music { background: var(--pop-yellow); color: var(--ink-dark); } 
        .tag-market { background: var(--pop-pink); color: white; }   
        .tag-sport { background: var(--pop-blue); color: white; }   
        .tag-free { background: white; color: var(--pop-pink); }     
        .tag-fee { background: var(--pop-purple); color: white; }     
        .tag-art { background: var(--pop-green); color: var(--ink-dark); }

        .event-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; line-height: 1.3;}
        .event-desc { font-size: 14px; color: #555; margin-bottom: 10px; line-height: 1.5; }
        
        /* 地點按鈕恢復精簡 */
        .event-loc { 
            font-size: 13px; font-weight: bold; color: var(--ink-dark); 
            background: #f0f4f8; padding: 6px 12px; border-radius: 8px; 
            display: inline-block; text-decoration: none; border: 1px solid #d1d9e6;
            transition: 0.2s; margin-top: 5px;
        }
        .event-loc:active { background: #dce4ec; transform: scale(0.97); }

        .postponed { background: #FFFBF0; border: 3px dashed #F39C12; box-shadow: 2px 2px 0px rgba(243, 156, 18, 0.2); }
        .postponed .event-title { color: var(--ink-dark); text-decoration: none; }
        .postponed .event-desc { color: #D35400; font-weight: bold; }
        .postponed .event-loc { opacity: 0.8; pointer-events: none; } 

        /* === 溫馨提醒免責聲明 === */
        .disclaimer {
            font-size: 13px; color: #888; font-weight: bold; line-height: 1.5;
            text-align: left; margin: 25px 15px; padding-top: 20px;
            border-top: 1px dashed #CCC;
        }

        .home-btn {
            display: inline-block; background: white; border: 3px solid var(--ink-dark); border-radius: 15px;
            padding: 10px 20px; font-size: 16px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 3px 3px 0px var(--ink-dark); transition: 0.2s;
            margin-bottom: 20px;
        }
        .home-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--ink-dark); }
        
        /* === 浮動頁尾暖心標語 === */
        .slogan-footer {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 249, 230, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); 
            border-top: 2px solid rgba(44, 62, 80, 0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px 0 max(12px, env(safe-area-inset-bottom));
            z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }
        .slogan-text {
            font-size: 14px; font-weight: bold; color: var(--ink-dark); letter-spacing: 1px;
            display: flex; align-items: center; gap: 4px;
        }
    </style>
</head>
<body>

    <div class="nav-info">
