<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東泳記 - 影音藝廊 (電視/電腦版)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; 
            min-height: 100vh;
        }

        /* 1. 解放寬度限制！改成 1200px (或 90%) 適合大螢幕 */
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 40px 60px 40px; }

        /* === 頂部導覽列 === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }
        .back-btn {
            background: white; border: 2px solid var(--ink-dark); padding: 8px 20px;
            border-radius: 20px; font-size: 18px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 3px 3px 0px var(--ink-dark);
        }
        .back-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 transparent; }
        
        /* 標題放大，遠看才清楚 */
        .page-title { font-size: 32px; font-weight: bold; color: var(--pop-pink); margin: 0; letter-spacing: 2px;}

        /* === 影音網格排版 (電視版改為 4 欄式) === */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 變成 4 欄並排 */
            gap: 20px; /* 照片間距拉大 */
        }

        /* 讓分類標題橫跨所有欄位 */
        .gallery-section-title {
            grid-column: 1 / -1; /* 1 / -1 代表從第一格橫跨到最後一格 */
            font-size: 24px; font-weight: bold; color: var(--ink-dark);
            margin-top: 30px; margin-bottom: 10px;
            border-bottom: 3px dashed rgba(176, 190, 197, 0.6);
            padding-bottom: 12px;
            display: flex; align-items: center; gap: 10px;
        }

        /* 統一設定照片外觀 */
        .media-item {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 16px; /* 圓角稍微加大 */
            border: 3px solid var(--ink-dark); /* 邊框加粗 */
            box-shadow: 4px 4px 0px rgba(44,62,80,0.15);
            background-color: #f5f5f5; 
            transition: transform 0.3s ease; /* 滑鼠移過去的特效準備 */
        }
        
        /* 讓照片在電腦上看有互動感 (滑鼠移過去會微微放大) */
        .media-item:hover {
            transform: scale(1.03);
            z-index: 10;
        }

        /* 影片樣式獨立設定：橫跨所有欄位，並設定為 16:9 電視比例 */
        video.media-item {
            aspect-ratio: 16 / 9; 
            grid-column: 1 / -1; /* 橫跨滿版 */
            max-height: 70vh; /* 避免影片太高超出電視螢幕 */
            margin: 0 auto; 
            background-color: #000;
        }
    </style>
</head>
