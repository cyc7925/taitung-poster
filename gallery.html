<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記 - 影音大廳</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; 
            min-height: 100vh;
        }

        /* 預設手機版樣式 */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px 40px 15px; }

        /* === 頂部導覽列 === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .back-btn {
            background: white; border: 2px solid var(--ink-dark); padding: 6px 14px;
            border-radius: 20px; font-size: 15px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 2px 2px 0px var(--ink-dark); white-space: nowrap;
        }
        .back-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 transparent; }
        
        .page-title { font-size: 24px; font-weight: bold; color: var(--pop-pink); margin: 0; letter-spacing: 1px;}

        /* === 主網格排版 === */
        .media-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

        /* 分類標題樣式 (包含折疊按鈕) */
        .gallery-section-title {
            font-size: 18px; font-weight: bold; color: var(--ink-dark);
            margin-top: 20px; margin-bottom: 5px;
            border-bottom: 2px dashed rgba(176, 190, 197, 0.6);
            padding-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }

        /* === 🗂️ 折疊相簿專用設定 === */
        .hotel-details {
            width: 100%;
            margin-bottom: 5px;
        }
        .hotel-details summary {
            list-style: none; /* 隱藏預設箭頭 */
            cursor: pointer;
            outline: none;
            transition: opacity 0.2s;
        }
        .hotel-details summary::-webkit-details-marker { display: none; }
        .hotel-details summary:active { opacity: 0.6; }
        
        /* 展開後的相片網格 (手機 2 欄，電腦 4 欄) */
        .hotel-photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-top: 15px; 
            padding-bottom: 10px;
        }

        /* 📸 一般網格照片 (4:3 長方形) */
        .media-item {
            width: 100%; 
            aspect-ratio: 4 / 3; 
            object-fit: cover; 
            border-radius: 12px; border: 2px solid var(--ink-dark); 
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            background-color: #f5f5f5; transition: transform 0.3s ease;
        }
        
        /* === 📺 電子相簿輪播區塊 === */
        .slideshow-wrapper { width: 100%; }
        .slideshow-container {
            width: 100%; aspect-ratio: 4 / 3; 
            background-color: #000; border-radius: 12px;
            border: 2px solid var(--ink-dark); box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            position: relative; overflow: hidden; cursor: pointer; 
        }

        .slide-img {
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0;
            opacity: 0; transition: opacity 0.8s ease-in-out; 
        }
        .slide-img.active { opacity: 1; }

        /* 移出畫面的精緻小控制器 */
        .external-controls {
            display: flex; justify-content: flex-end; 
            gap: 10px; margin-top: 10px; margin-bottom: 10px;
        }
        
        .control-btn {
            background: white; border: 2px solid var(--ink-dark);
            padding: 5px 14px; border-radius: 20px; font-size: 13px;
            font-weight: bold; color: var(--ink-dark); cursor: pointer;
            box-shadow: 2px 2px 0px rgba(44,62,80,0.2);
            display: flex; align-items: center; outline: none; font-family: inherit;
        }
        .control-btn:active { transform: translate(1px,1px); box-shadow: none; }

        /* 📱 破解 Apple iOS 手機專用全螢幕 */
        .slideshow-wrapper.fullscreen-mode {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important; background-color: #000 !important;
            z-index: 9999 !important; display: flex; flex-direction: column; justify-content: center;
            margin: 0 !important;
        }
        .slideshow-wrapper.fullscreen-mode .slideshow-container {
            border: none !important; border-radius: 0 !important;
            height: auto !important; aspect-ratio: auto !important; flex: 1;
        }
        .slideshow-wrapper.fullscreen-mode .external-controls {
            position: absolute; bottom: 40px; right: 20px; z-index: 10000;
        }

        /* 💻 響應式設計：螢幕變大時自動套用 */
        @media (min-width: 768px) {
            .container { padding: 30px 40px 60px 40px; }
            .page-title { font-size: 32px; }
            .gallery-section-title { font-size: 24px; border-bottom-width: 3px; }
            .hotel-photo-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            .slideshow-container { aspect-ratio: 16 / 9; border-radius: 16px; border-width: 3px; }
            .media-item { border-width: 3px; border-radius: 16px; box-shadow: 4px 4px 0px rgba(44,62,80,0.15); }
            .media-item:hover { transform: scale(1.05); z-index: 10; position: relative; }
        }
    </style>
</head>
<body>

<!-- ⚙️ JavaScript 雙引擎控制器 (包含 iOS 全螢幕破解) -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const slides = document.querySelectorAll(".slide-img");
        const playBtn = document.getElementById("togglePlayBtn");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const slideshowArea = document.getElementById("slideshowArea");
        const wrapper = document.querySelector(".slideshow-wrapper"); 
        
        let currentIndex = 0;
        let isPlaying = true;
        let slideInterval;

        function nextSlide() {
            slides[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add("active");
        }

        function startSlideShow() { slideInterval = setInterval(nextSlide, 2500); }
        function stopSlideShow() { clearInterval(slideInterval); }

        startSlideShow();

        function togglePlay() {
            if (isPlaying) {
                stopSlideShow();
                playBtn.innerHTML = "▶️ 播放";
                isPlaying = false;
            } else {
                nextSlide();
                startSlideShow();
                playBtn.innerHTML = "⏸ 暫停";
                isPlaying = true;
            }
        }

        playBtn.addEventListener("click", togglePlay);
        slideshowArea.addEventListener("click", togglePlay);

        // 全螢幕功能 (雙重保險設計)
        fullscreenBtn.addEventListener("click", function() {
            const isNativeFs = document.fullscreenElement || document.webkitFullscreenElement;
            const isFakeFs = wrapper.classList.contains("fullscreen-mode");

            if (isNativeFs) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                fullscreenBtn.innerHTML = "⛶ 全螢幕";
            } else if (isFakeFs) {
                wrapper.classList.remove("fullscreen-mode");
                document.body.style.overflow = "auto"; 
                fullscreenBtn.innerHTML = "⛶ 全螢幕";
            } else {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen().then(() => {
                        fullscreenBtn.innerHTML = "✖ 退出";
                    }).catch(() => enterFakeFullscreen());
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                    fullscreenBtn.innerHTML = "✖ 退出";
                } else {
                    enterFakeFullscreen();
                }
            }
        });

        function enterFakeFullscreen() {
            wrapper.classList.add("fullscreen-mode");
            document.body.style.overflow = "hidden"; 
            fullscreenBtn.innerHTML = "✖ 退出";
        }
    });
</script>
