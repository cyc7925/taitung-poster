<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記 - 影音大廳</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; 
            min-height: 100vh;
        }

        /* 預設為手機版樣式 */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px 40px 15px; }

        /* === 頂部導覽列 === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .back-btn {
            background: white; border: 2px solid var(--ink-dark); padding: 6px 14px;
            border-radius: 20px; font-size: 15px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 2px 2px 0px var(--ink-dark); white-space: nowrap;
        }
        .back-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 transparent; }
        
        .page-title { font-size: 24px; font-weight: bold; color: var(--pop-pink); margin: 0; letter-spacing: 1px;}

        /* === 影音網格排版 (預設手機為 2 欄式) === */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        /* 分類標題橫跨整個螢幕 */
        .gallery-section-title {
            grid-column: 1 / -1; 
            font-size: 18px; font-weight: bold; color: var(--ink-dark);
            margin-top: 25px; margin-bottom: 5px;
            border-bottom: 2px dashed rgba(176, 190, 197, 0.6);
            padding-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }

        /* 統一設定靜態照片外觀 */
        .media-item {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 12px; 
            border: 2px solid var(--ink-dark); 
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            background-color: #f5f5f5; 
            transition: transform 0.3s ease;
        }
        
        /* === 📺 自訂電子相簿輪播區塊 === */
        .slideshow-container {
            grid-column: 1 / -1; /* 橫跨滿版 */
            width: 100%;
            aspect-ratio: 16 / 9; /* 保持類似影片的電視比例 */
            background-color: #000;
            border-radius: 12px;
            border: 2px solid var(--ink-dark);
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            position: relative;
            overflow: hidden;
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 如果想要整張圖看到滿，可以改為 contain */
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease-in-out; /* 淡入淡出效果 */
        }
        .slide-img.active {
            opacity: 1;
        }

        /* 播放/暫停控制器按鈕 */
        .slide-controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
            border: 1px solid var(--ink-dark);
        }
        .play-btn {
            background: none; border: none; font-size: 14px; font-weight: bold;
            color: var(--ink-dark); cursor: pointer; display: flex; align-items: center; gap: 4px;
            font-family: inherit; outline: none; padding: 0;
        }

        /* 💻 響應式設計 (RWD)：當螢幕大於 768px (平板/電腦/電視) 時自動套用以下設定 */
        @media (min-width: 768px) {
            .container { padding: 30px 40px 60px 40px; }
            .page-title { font-size: 32px; letter-spacing: 2px; }
            .top-nav { margin-bottom: 30px; }
            .back-btn { font-size: 18px; padding: 8px 20px; box-shadow: 3px 3px 0px var(--ink-dark); }
            
            /* 電腦版自動變成 4 欄 */
            .media-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            .gallery-section-title { font-size: 24px; border-bottom-width: 3px; }
            .media-item { border-width: 3px; border-radius: 16px; box-shadow: 4px 4px 0px rgba(44,62,80,0.15); }
            .media-item:hover { transform: scale(1.05); z-index: 10; position: relative; }
            .slideshow-container { border-width: 3px; border-radius: 16px; }
        }
    </style>
</head>

<!-- ⚙️ 處理電子相簿輪播與暫停按鈕的 JavaScript 程式碼 -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const slides = document.querySelectorAll(".slide-img");
        const playBtn = document.getElementById("togglePlayBtn");
        let currentIndex = 0;
        let isPlaying = true;
        let slideInterval;

        // 切換到下一張照片的函數
        function nextSlide() {
            slides[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add("active");
        }

        // 開始輪播 (設定每 2.5 秒換一張)
        function startSlideShow() {
            slideInterval = setInterval(nextSlide, 2500);
        }

        // 停止輪播
        function stopSlideShow() {
            clearInterval(slideInterval);
        }

        // 初始化開始播放
        startSlideShow();

        // 點擊按鈕時的動作
        playBtn.addEventListener("click", function() {
            if (isPlaying) {
                stopSlideShow();
                playBtn.innerHTML = "▶️ 播放";
                isPlaying = false;
            } else {
                nextSlide(); // 馬上換下一張
                startSlideShow();
                playBtn.innerHTML = "⏸ 暫停";
                isPlaying = true;
            }
        });
    });
</script>
