<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記 - 影音大廳</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; 
            min-height: 100vh;
        }

        /* 預設手機版樣式 */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px 40px 15px; }

        /* === 頂部導覽列 === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .back-btn {
            background: white; border: 2px solid var(--ink-dark); padding: 6px 14px;
            border-radius: 20px; font-size: 15px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 2px 2px 0px var(--ink-dark); white-space: nowrap;
        }
        .back-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 transparent; }
        
        .page-title { font-size: 24px; font-weight: bold; color: var(--pop-pink); margin: 0; letter-spacing: 1px;}

        /* === 影音網格排版 (手機預設 2 欄) === */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        /* 分類標題 */
        .gallery-section-title {
            grid-column: 1 / -1; 
            font-size: 18px; font-weight: bold; color: var(--ink-dark);
            margin-top: 25px; margin-bottom: 5px;
            border-bottom: 2px dashed rgba(176, 190, 197, 0.6);
            padding-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }

        /* 一般網格照片 */
        .media-item {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; 
            border-radius: 12px; border: 2px solid var(--ink-dark); 
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            background-color: #f5f5f5; transition: transform 0.3s ease;
        }
        
        /* === 📺 電子相簿輪播區塊 (畫面長高) === */
        .slideshow-wrapper {
            grid-column: 1 / -1; 
            width: 100%;
        }
        .slideshow-container {
            width: 100%;
            aspect-ratio: 4 / 3; /* 讓手機版的畫面變得更高！ */
            background-color: #000;
            border-radius: 12px;
            border: 2px solid var(--ink-dark);
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            position: relative;
            overflow: hidden;
            cursor: pointer; /* 提示可以點擊 */
        }

        .slide-img {
            width: 100%; height: 100%;
            object-fit: cover; 
            position: absolute; top: 0; left: 0;
            opacity: 0; transition: opacity 0.8s ease-in-out; 
        }
        .slide-img.active { opacity: 1; }

        /* 移出畫面的精緻小控制器 */
        .external-controls {
            display: flex; justify-content: flex-end; /* 靠右對齊 */
            gap: 10px; margin-top: 10px; margin-bottom: 10px;
        }
        
        .control-btn {
            background: white; border: 2px solid var(--ink-dark);
            padding: 5px 14px; border-radius: 20px; font-size: 13px;
            font-weight: bold; color: var(--ink-dark); cursor: pointer;
            box-shadow: 2px 2px 0px rgba(44,62,80,0.2);
            display: flex; align-items: center; outline: none; font-family: inherit;
        }
        .control-btn:active { transform: translate(1px,1px); box-shadow: none; }

        /* 💻 響應式設計：螢幕變大時自動套用 */
        @media (min-width: 768px) {
            .container { padding: 30px 40px 60px 40px; }
            .page-title { font-size: 32px; }
            .media-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
            .slideshow-container { aspect-ratio: 16 / 9; /* 電腦電視版自動切換為寬螢幕 */ border-radius: 16px; border-width: 3px; }
            .media-item { border-width: 3px; border-radius: 16px; }
            .media-item:hover { transform: scale(1.05); z-index: 10; position: relative; }
        }
    </style>
</head>
<body>

<!-- ⚙️ JavaScript 控制器 -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const slides = document.querySelectorAll(".slide-img");
        const playBtn = document.getElementById("togglePlayBtn");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const slideshowArea = document.getElementById("slideshowArea");
        
        let currentIndex = 0;
        let isPlaying = true;
        let slideInterval;

        function nextSlide() {
            slides[currentIndex].classList.remove("active");
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add("active");
        }

        function startSlideShow() { slideInterval = setInterval(nextSlide, 2500); }
        function stopSlideShow() { clearInterval(slideInterval); }

        startSlideShow();

        // 獨立的播放/暫停切換邏輯
        function togglePlay() {
            if (isPlaying) {
                stopSlideShow();
                playBtn.innerHTML = "▶️ 播放";
                isPlaying = false;
            } else {
                nextSlide();
                startSlideShow();
                playBtn.innerHTML = "⏸ 暫停";
                isPlaying = true;
            }
        }

        // 綁定按鈕點擊
        playBtn.addEventListener("click", togglePlay);
        
        // 綁定照片點擊 (進入全螢幕後也可以點畫面暫停)
        slideshowArea.addEventListener("click", togglePlay);

        // 全螢幕功能
        fullscreenBtn.addEventListener("click", function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (slideshowArea.requestFullscreen) {
                    slideshowArea.requestFullscreen();
                } else if (slideshowArea.webkitRequestFullscreen) {
                    slideshowArea.webkitRequestFullscreen(); /* 支援 Safari */
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen(); /* 支援 Safari */
                }
            }
        });
    });
</script>
