<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>東泳記 - 影音藝廊</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/justfont/open-huninn-font/font.css">
    
    <style>
        :root {
            --ink-dark: #2C3E50;     
            --pop-pink: #FF6B6B;     
            --pop-yellow: #FFE66D;   
        }

        body {
            background: linear-gradient(180deg, #e0f7fa 0%, #fffde7 100%);
            color: var(--ink-dark);
            font-family: 'jf-openhuninn-1.1', sans-serif;
            margin: 0; padding: 0; 
            min-height: 100vh;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 15px 15px 40px 15px; }

        /* === 頂部導覽列 === */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .back-btn {
            background: white; border: 2px solid var(--ink-dark); padding: 6px 14px;
            border-radius: 20px; font-size: 14px; font-weight: bold; color: var(--ink-dark);
            text-decoration: none; box-shadow: 2px 2px 0px var(--ink-dark);
        }
        .back-btn:active { transform: translate(1px, 1px); box-shadow: 0 0 0 transparent; }
        
        .page-title { font-size: 22px; font-weight: bold; color: var(--pop-pink); margin: 0; letter-spacing: 1px;}

        /* === 影音網格排版 (雙欄式) === */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px; 
        }

        /* 讓分類標題橫跨兩格 */
        .gallery-section-title {
            grid-column: span 2;
            font-size: 16px; font-weight: bold; color: var(--ink-dark);
            margin-top: 15px; margin-bottom: 2px;
            border-bottom: 2px dashed rgba(176, 190, 197, 0.6);
            padding-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }

        /* 統一設定照片與影片的外觀 */
        .media-item {
            width: 100%;
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            border-radius: 12px;
            border: 2px solid var(--ink-dark);
            box-shadow: 2px 2px 0px rgba(44,62,80,0.15);
            background-color: #f5f5f5; 
        }

        /* 影片樣式獨立設定：解除正方形限制，並橫跨兩格方便點擊 */
        video.media-item {
            aspect-ratio: auto; 
            grid-column: span 2; 
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 頂部返回按鈕與標題 -->
    <div class="top-nav">
        <!-- 如果你的首頁檔名叫 index.html，請確認這裡一致 -->
        <a href="home.html" class="back-btn">⬅ 返回首頁</a>
        <h1 class="page-title">📸 影音藝廊</h1>
    </div>

    <!-- 影音專區開始 -->
    <div class="media-grid">

        <!-- 🎥 影片保留區 (加上 controls 就會自動有播放/暫停/音量控制) -->
        <div class="gallery-section-title"><span style="color:var(--pop-pink);">🎬</span> 精彩影片預告</div>
        <video controls class="media-item">
            <!-- 未來有影片時，把這裡的 src 換成你的影片檔名 (例如: Images/intro.mp4) -->
            <source src="Images/your-video.mp4" type="video/mp4">
            您的瀏覽器不支援影片播放。
        </video>

        <!-- 📸 東遊季溫泉渡假村 (7張) -->
        <div class="gallery-section-title"><span style="color:var(--pop-pink);">♨️</span> 東遊季溫泉渡假村</div>
        <img src="Images/tyg-1.jpg" class="media-item" alt="東遊季照片">

        <!-- 📸 ㄚㄧㄚ旺溫泉渡假村 (4張) -->

        <img src="Images/yy-1.jpg" class="media-item" alt="ㄚㄧㄚ旺照片">

    </div>
</div>

</body>
</html>
